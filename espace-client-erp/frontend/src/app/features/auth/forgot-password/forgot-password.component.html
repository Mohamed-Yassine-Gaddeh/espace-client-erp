<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__brand">
      <span class="auth-card__mark">EC</span>
      <span class="auth-card__brand-name">{{ i18n.t('app.brand') }}</span>
    </div>

    <h1 class="auth-card__title">{{ i18n.t('forgot.title') }}</h1>
    <p class="auth-card__subtitle">
      {{ i18n.t('forgot.subtitle') }}
    </p>

    @if (successMessage()) {
      <div class="auth-success" role="status">{{ successMessage() }}</div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
        <div class="auth-field">
          <label for="email">{{ i18n.t('forgot.email') }}</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="vous@entreprise.com"
          />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <span class="auth-field__error">{{ i18n.t('login.emailInvalid') }}</span>
          }
        </div>

        <button type="submit" class="auth-button" [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            {{ i18n.t('forgot.submitting') }}
          } @else {
            {{ i18n.t('forgot.submit') }}
          }
        </button>
      </form>
    }

    <p class="auth-card__footer">
      <a routerLink="/login">{{ i18n.t('forgot.backToLogin') }}</a>
    </p>
  </div>
</div>
